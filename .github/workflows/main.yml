# Linode APL default Workflow
# Required repository/environment secrets:
#   OCI_USERNAME              - registry login username
#   DOCKERHUB_LINODEBOT_TOKEN - registry login token
name: Build test push release
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "adr/**"
      - ".vscode/**"
      - "**.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "adr/**"
      - ".vscode/**"
      - "**.md"
env:
  COMMIT_MSG: ${{ github.event.head_commit.message }}
  REGISTRY: docker.io
  REPO: linode/apl-api
  BOT_EMAIL: ${{ vars.BOT_EMAIL }}
  BOT_USERNAME: ${{ vars.BOT_USERNAME }}
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

jobs:
  build-test-push-release:
    runs-on: ubuntu-22.04
    env:
      SHOULD_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    steps:
      - name: Set tag
        id: set_tag
        run: |
          tag=$(basename "$GITHUB_REF")
          echo "Creating tag: $tag"
          echo "tag=$tag" >> $GITHUB_OUTPUT
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch values-schema.yaml from apl-core
        run: |
          # Try matching branch first, fall back to main
          curl -sL -f -H "Authorization: token ${{ env.BOT_TOKEN }}" \
            "https://raw.githubusercontent.com/linode/apl-core/${{ steps.set_tag.outputs.tag }}/values-schema.yaml" \
            -o src/values-schema.yaml 2>/dev/null \
          || curl -sL -f -H "Authorization: token ${{ env.BOT_TOKEN }}" \
            "https://raw.githubusercontent.com/linode/apl-core/main/values-schema.yaml" \
            -o src/values-schema.yaml
          echo "Schema fetched for branch: ${{ steps.set_tag.outputs.tag }} (with main fallback)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.DOCKERHUB_LINODEBOT_TOKEN }}
      - name: Build, test, push
        uses: docker/build-push-action@v7
        with:
          push: ${{ env.SHOULD_PUSH == 'true' }}
          load: ${{ env.SHOULD_PUSH == 'true' }}
          context: .
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}:${{ steps.set_tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
