DnsAkamai:
  title: Akamai
  properties:
    akamai:
      x-hideTitle: true
      properties:
        host:
          title: Akamai API host
          description: Akamai Edgegrid API server
          type: string
          x-acl:
            platformAdmin: [read-any, update-any]
            teamAdmin: []
            teamMember: []
        accessToken:
          title: Akamai access token
          description: Akamai Edgegrid API access token
          type: string
          x-acl:
            platformAdmin: [read-any, update-any]
            teamAdmin: []
            teamMember: []
          x-secret: true
        clientToken:
          title: Akamai client token
          description: Akamai Edgegrid API client token
          type: string
          x-acl:
            platformAdmin: [read-any, update-any]
            teamAdmin: []
            teamMember: []
          x-secret: true
        clientSecret:
          title: Akamai client secret
          description: Akamai Edgegrid API client secret
          type: string
          x-acl:
            platformAdmin: [read-any, update-any]
            teamAdmin: []
            teamMember: []
          x-secret: true
      required:
        - host
        - accessToken
        - clientToken
        - clientSecret
      type: object

awsAccessKey:
  title: AWS access key
  description: An AWS access key ID.
  type: string
  x-secret: true
awsSecretKey:
  title: AWS secret key
  description: An AWS secret key.
  type: string
  x-secret: true
awsRegion:
  title: AWS region
  description: An AWS region.
  type: string
awsRole:
  description: Role may be set explicitly if no metadata can be accessed.
  example: arn:aws:iam::YYYYYYYYYYYY:role/dns-manager
  type: string

DnsAws:
  title: AWS
  properties:
    aws:
      x-hideTitle: true
      properties:
        credentials:
          properties:
            secretKey:
              $ref: '#/awsSecretKey'
            accessKey:
              $ref: '#/awsAccessKey'
          x-acl:
            platformAdmin: [read-any, update-any]
            teamAdmin: []
            teamMember: []
          type: object
        region:
          $ref: '#/awsRegion'
        role:
          $ref: '#/awsRole'
      required: [region]
      type: object
  required:
    - aws
  type: object

azureClientId:
  title: Azure client id
  description: An Azure client id.
  type: string
  x-secret: true
azureClientSecret:
  title: Azure client secret
  description: An Azure client secret.
  type: string
  x-secret: true
  x-acl:
    platformAdmin: [read-any, update-any]
    teamAdmin: []
    teamMember: []
azureResourceGroup:
  title: Azure resource group
  description: An Azure resource group.
  type: string
azureSubscriptionId:
  title: Azure subscription id
  description: An Azure subscription id.
  type: string
azureTenantId:
  title: Azure tenant id
  description: An Azure tenant id. Defaults to one found in metadata.
  type: string
azureDns:
  x-hideTitle: true
  properties:
    resourceGroup:
      $ref: '#/azureResourceGroup'
    hostedZoneName:
      title: Hosted zone name
      description: Name of the DNS zone that should be used.
      $ref: 'definitions.yaml#/wordCharacterPattern'
    tenantId:
      $ref: '#/azureTenantId'
    subscriptionId:
      $ref: '#/azureSubscriptionId'
    aadClientId:
      $ref: '#/azureClientId'
    aadClientSecret:
      $ref: '#/azureClientSecret'
      title: Client secret
      type: string
      description: Azure Application Client Secret
      x-acl:
        platformAdmin: [read-any, update-any]
        teamAdmin: []
        teamMember: []
      x-secret: true
  required:
    - tenantId
    - subscriptionId
    - resourceGroup
    - aadClientId
    - aadClientSecret

DnsAzure:
  title: Azure
  properties:
    azure:
      $ref: '#/azureDns'
  required:
    - azure
  type: object

DnsAzurePrivate:
  title: Azure Private DNS
  properties:
    azure-private-dns:
      $ref: '#/azureDns'
  required:
    - azure-private-dns
  type: object

DnsCloudflare:
  title: CloudFlare
  properties:
    cloudflare:
      x-hideTitle: true
      properties:
        apiToken:
          type: string
          x-acl:
            platformAdmin: [read-any, update-any]
            teamAdmin: []
            teamMember: []
          x-secret: true
        apiSecret:
          type: string
          description: Required when Email is set.
          x-acl:
            platformAdmin: [read-any, update-any]
            teamAdmin: []
            teamMember: []
          x-secret: true
        email:
          $ref: 'definitions.yaml#/email'
          description: Required when ApiSecret is set.
        proxied:
          type: boolean
          default: true
      type: object
  required:
    - cloudflare
  type: object

DnsDigitalOcean:
  title: Digital Ocean
  properties:
    digitalocean:
      x-hideTitle: true
      properties:
        apiToken:
          type: string
          x-acl:
            platformAdmin: [read-any, update-any]
            teamAdmin: []
            teamMember: []
          x-secret: true
      type: object
  required:
    - digitalocean
  type: object

DnsLinode:
  title: Linode
  properties:
    linode:
      x-hideTitle: true
      properties:
        apiToken:
          type: string
          x-acl:
            platformAdmin: [read-any, update-any]
            teamAdmin: []
            teamMember: []
          x-secret: true
      type: object
  required:
    - linode
  type: object

googleAccountJson:
  description: Enter GCP account JSON for authentication.
  title: Account JSON
  type: string
  x-secret: true
  x-formtype: textarea
googleProject:
  description: Enter GCP project.
  title: GCP Project
  type: string
  
DnsGoogle:
  title: Google
  properties:
    google:
      x-hideTitle: true
      properties:
        serviceAccountKey:
          $ref: '#/googleAccountJson'
          description: A service account key in json format for managing a DNS zone.
          x-acl:
            platformAdmin: [read-any, update-any]
            teamAdmin: []
            teamMember: []
            x-secret: true
        project:
          $ref: '#/googleProject'
      required: [project]
      type: object
  required:
    - google
  type: object

DnsOther:
  title: Other
  properties:
    other:
      description: This option requires configuration for both external-dns as well as cert-manager. No schema validation is available so provide correct data.
      type: object
      properties:
        name:
          type: string
          description: Name of the provider.
        external-dns:
          title: YAML for external-dns.
          type: object
          description: 'The provider config'
          x-acl:
            platformAdmin: [read-any, update-any]
            teamAdmin: []
            teamMember: []
          x-secret: true
        cert-manager:
          title: YAML for cert-manager.
          type: object
          description: 'The dns01 config as provided here: https://cert-manager.io/docs/configuration/acme/dns01/'
          x-acl:
            platformAdmin: [read-any, update-any]
            teamAdmin: []
            teamMember: []
          x-secret: true
      required:
        - name
        - external-dns
        - cert-manager
  required:
    - other
